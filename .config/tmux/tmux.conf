##### Core behavior #####

# Vi-style keys everywhere
set-option -g status-keys vi
set-window-option -g mode-keys vi

# Scrollback
set-option -g history-limit 10000

# Faster ESC for vim/neovim
set -sg escape-time 10

# Truecolor support (kitty + ghostty + alacritty outdoors, tmux-256color indoors)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",xterm-kitty:Tc,xterm-ghostty:Tc"
set -as terminal-features ",xterm-kitty:RGB,xterm-ghostty:RGB,xterm-256color:RGB"


##### Prefix #####

# Use C-a as prefix
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix



##### Mouse & bells #####

set -g mouse on
set -g visual-bell on
set -g bell-action none


##### Windows & panes #####

# Smart window naming
set -g automatic-rename on
set -g renumber-windows on

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Split panes, preserving CWD
bind-key _ split-window -v -c "#{pane_current_path}"
bind-key | split-window -h -c "#{pane_current_path}"

# Zoom pane toggle
bind z resize-pane -Z

# Move to next/previous windows
bind p previous-window
bind n next-window


##### Copy mode (vi muscle memory) #####

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel


##### Session / window UX #####

# Tree-based chooser
bind w choose-tree -Zw

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux reloaded"


##### Safety #####

# Confirm before killing a session
bind X confirm-before -p "Kill session #S? (y/n)" kill-session

# Confirm before detaching
bind d confirm-before -p "Detach tmux? (y/n)" detach-client

# Set synchronize-pane
bind S setw synchronize-panes\; display-message "synchronize-panes: #{?pane_synchronized,on,off}"

##### Status line #####

set -g status-position bottom 
set -g status-left-length 40
set -g status-right-length 40

# Show prefix state + session name
set -g status-left "#{?client_prefix,#[fg=red]⎈ ,}#S "

# Simple clock on the right
set -g status-right "%Y-%m-%d %H:%M"

# Start counting windows from 1, not 0
set -g base-index 1
set -g pane-base-index 1

