# Temporary tmux-style keybindings for native Kitty windows.
# Remove the include from kitty.conf to revert.
map_timeout 1.0
enabled_layouts splits,stack

# Prefix: Ctrl+A
map ctrl+a>ctrl+a send_text all \x01

# Pane navigation (tmux select-pane h/j/k/l)
map ctrl+a>h neighboring_window left
map ctrl+a>j neighboring_window bottom
map ctrl+a>k neighboring_window top
map ctrl+a>l neighboring_window right

# Splits: tmux | is side-by-side; _ is top/bottom
map ctrl+a>shift+backslash combine : goto_layout splits : launch --location=vsplit --cwd=current
map ctrl+a>shift+minus combine : goto_layout splits : launch --location=hsplit --cwd=current

# Resize panes by five cells/lines
map ctrl+a>shift+h resize_window narrower 5
map ctrl+a>shift+j resize_window shorter 5
map ctrl+a>shift+k resize_window taller 5
map ctrl+a>shift+l resize_window wider 5

# Zoom pane and manage tmux-like windows as Kitty tabs
map ctrl+a>z toggle_layout stack
map ctrl+a>c launch --type=tab --cwd=current
map ctrl+a>n next_tab
map ctrl+a>p previous_tab
map ctrl+a>1 goto_tab 1
map ctrl+a>2 goto_tab 2
map ctrl+a>3 goto_tab 3
map ctrl+a>4 goto_tab 4
map ctrl+a>5 goto_tab 5
map ctrl+a>6 goto_tab 6
map ctrl+a>7 goto_tab 7
map ctrl+a>8 goto_tab 8
map ctrl+a>9 goto_tab 9
map ctrl+a>r load_config_file
